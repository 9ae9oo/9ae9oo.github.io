<!DOCTYPE html>
<html lang="ko" data-preset="base">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="개인 창작자용 워크스페이스 — 작업 관리, 일정, 정산과 세무 참고자료를 한 탭에서.">
<meta name="color-scheme" content="light">
<title>Creator Workspace</title>
<link rel="stylesheet" href="./css/tokens.css">
<link rel="stylesheet" href="./css/shell.css">
<link rel="stylesheet" href="./css/widgets.css">
<link rel="stylesheet" href="./css/calendar.css">
<link rel="stylesheet" href="./css/ledger.css">
<link rel="stylesheet" href="./css/work.css">
</head>
<body data-route="home">

<div id="app">

  <!-- 좌측 레일 — 메인 페이지 이동 (아이콘만) -->
  <aside id="sidebar" class="sidebar">
    <nav class="sidebar-nav">
      <button class="sidebar-item" data-nav="home" title="대시보드"><span class="icon">🏠</span><span class="label">대시보드</span></button>
      <button class="sidebar-item" data-nav="work" title="작업"><span class="icon">🎬</span><span class="label">작업</span></button>
      <button class="sidebar-item" data-nav="calendar" title="캘린더"><span class="icon">📅</span><span class="label">캘린더</span></button>
      <button class="sidebar-item" data-nav="ledger" title="정산"><span class="icon">💰</span><span class="label">정산</span></button>
      <button class="sidebar-item" data-nav="settings" title="설정"><span class="icon">⚙️</span><span class="label">설정</span></button>
    </nav>
  </aside>

  <div id="content">
    <!-- 빠른 일정 입력 — 컨텐츠 상단에 떠 있음 (바 배경 없음) -->
    <div id="quickbar">
      <input type="text" id="quick-add-input" class="quick-add-input" placeholder="내일 오후 3시 회의 / 할일" autocomplete="off">
    </div>

    <main id="main">

      <section class="page active" data-page="home">
        <div class="page-head page-head-flex">
          <h1 id="home-title">대시보드</h1>
          <div id="home-edit-bar"></div>
        </div>
        <div id="page-home-body"></div>
      </section>

      <section class="page" data-page="work">
        <div class="page-head">
          <h1>WORKFLOW</h1>
          <p>작품 → 회차 → 컷 단위로 공정을 체크합니다.</p>
        </div>
        <div id="page-work-body"></div>
      </section>

      <section class="page" data-page="calendar">
        <div class="page-head">
          <h1>캘린더</h1>
          <p>월 · 주 · 일 뷰. 날짜를 붙인 할 일도 함께 표시됩니다.</p>
        </div>
        <div id="page-calendar-body"></div>
      </section>

      <section class="page" data-page="ledger">
        <div class="page-head">
          <h1>정산</h1>
          <p>가계부 · 어시스턴트 · 세무 참고자료. 같은 금액을 두 번 입력하지 않습니다.</p>
        </div>
        <div id="page-ledger-body"></div>
      </section>

      <section class="page" data-page="settings">
        <div class="page-head">
          <h1>설정</h1>
          <p>재생목록, 장부 카테고리, 해빗과 그룹처럼 가끔 손대는 관리는 모두 여기에서.</p>
        </div>
        <div id="page-settings-body"></div>
      </section>

    </main>

    <!-- 음악 미니바 — 컨텐츠 하단에 떠 있음. music.js 가 채웁니다 (곡 없으면 숨김) -->
    <div id="musicmini" hidden></div>
  </div>

  <!-- 우측 레일 — 컨텐츠 오른쪽 가장자리 가운데의 작은 탭들 -->
  <aside id="toolrail">
    <button class="tool-item" data-float="inbox" title="Inbox" aria-label="Inbox"><span class="icon">📥</span><span class="label">Inbox</span></button>
    <button class="tool-item" data-float="memo" title="Memo" aria-label="Memo"><span class="icon">📝</span><span class="label">Memo</span></button>
    <button class="tool-item" data-float="music" title="Music" aria-label="Music"><span class="icon">🎵</span><span class="label">Music</span></button>
    <button class="tool-item" id="timer-trigger" data-float="timer" title="Timer" aria-label="Timer"><span class="icon">⏱️</span><span class="label">Timer</span></button>
  </aside>

  <!-- 도구 패널 자리 — 열리면 폭이 생겨 메인이 그만큼 줄어듦 -->
  <div id="panelhost"></div>

</div>

<div id="toast-wrap"></div>

<!-- 번들러 없이 순서대로 로드합니다 (file:// 로 열어도 동작하도록 ES module 을 쓰지 않습니다) -->
<script src="./js/util.js"></script>
<script src="./js/store.js"></script>
<script src="./js/shell.js"></script>
<script src="./js/quick-add.js"></script>
<script src="./js/markdown.js"></script>
<script src="./js/timer.js"></script>
<script src="./js/music.js"></script>
<script src="./js/todo.js"></script>
<script src="./js/memo.js"></script>
<script src="./js/habits.js"></script>
<script src="./js/habitgrid.js"></script>
<script src="./js/calendar.js"></script>
<script src="./js/work.js"></script>
<script src="./js/ledger.js"></script>
<script src="./js/assistants.js"></script>
<script src="./js/tax.js"></script>
<script src="./js/settings.js"></script>
<script src="./js/app.js"></script>

</body>
</html>
