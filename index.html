<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="description" content="개인 창작자용 워크스페이스 — 작업 관리, 일정, 정산과 세무 참고자료를 한 탭에서.">
<meta name="color-scheme" content="dark light">
<title>Creator Workspace</title>
<link rel="stylesheet" href="./css/tokens.css">
<link rel="stylesheet" href="./css/shell.css">
<link rel="stylesheet" href="./css/widgets.css">
<link rel="stylesheet" href="./css/calendar.css">
<link rel="stylesheet" href="./css/ledger.css">
<link rel="stylesheet" href="./css/work.css">
</head>
<body data-route="home">

<div id="app">

  <!-- 왼쪽 사이드바 (메인 페이지 네비게이션) -->
  <aside id="sidebar" class="sidebar">
    <div class="sidebar-header">
      <button id="sidebar-toggle-btn" class="sidebar-toggle" aria-label="메뉴 열고 닫기">
        <span class="toggle-icon">☰</span>
      </button>
    </div>
    <nav class="sidebar-nav">
      <button class="sidebar-item" data-nav="home" title="홈">
        <span class="icon">🏠</span>
        <span class="label">홈</span>
      </button>
      <button class="sidebar-item" data-nav="work" title="작업">
        <span class="icon">🎬</span>
        <span class="label">작업</span>
      </button>
      <button class="sidebar-item" data-nav="calendar" title="캘린더">
        <span class="icon">📅</span>
        <span class="label">캘린더</span>
      </button>
      <button class="sidebar-item" data-nav="ledger" title="정산">
        <span class="icon">💰</span>
        <span class="label">정산</span>
      </button>
      <button class="sidebar-item" data-nav="settings" title="설정">
        <span class="icon">⚙️</span>
        <span class="label">설정</span>
      </button>
    </nav>
  </aside>

  <div id="body">
    <!-- 상단 고정 네비게이션 — 빠른 입력 + 음악 플레이어 -->
    <header id="topbar">
      <!-- 빠른 일정 입력 (데스크톱 전용) -->
      <div class="quick-add-wrap">
        <input type="text" id="quick-add-input" class="quick-add-input" placeholder="내일 오후 3시 회의 / 할일" autocomplete="off">
      </div>

      <!-- 음악 (music.js 가 내용을 채웁니다) -->
      <div id="musicbar"></div>

      <!-- 음악 플레이어 팝업 트리거 (모바일) -->
      <button id="music-popup-trigger" class="btn btn-icon music-popup-btn" title="음악 플레이어" aria-label="음악 플레이어">
        <span class="icon">🎵</span>
      </button>
    </header>

    <main id="main">

      <section class="page active" data-page="home">
        <div class="page-head">
          <h1>홈</h1>
          <p>오늘 하루를 한눈에. 타이머·메모·할 일은 위쪽 버튼으로 언제든 띄웁니다.</p>
        </div>
        <div id="page-home-body"></div>
      </section>

      <section class="page" data-page="work">
        <div class="page-head">
          <h1>작업</h1>
          <p>작품 → 회차 → 컷 단위로 공정을 체크합니다.</p>
        </div>
        <div id="page-work-body"></div>
      </section>

      <section class="page" data-page="calendar">
        <div class="page-head">
          <h1>캘린더</h1>
          <p>월 · 주 · 일 뷰. 날짜를 붙인 할 일도 함께 표시됩니다.</p>
        </div>
        <div id="page-calendar-body"></div>
      </section>

      <section class="page" data-page="ledger">
        <div class="page-head">
          <h1>정산</h1>
          <p>가계부 · 어시스턴트 · 세무 참고자료. 같은 금액을 두 번 입력하지 않습니다.</p>
        </div>
        <div id="page-ledger-body"></div>
      </section>

      <section class="page" data-page="settings">
        <div class="page-head">
          <h1>설정</h1>
          <p>재생목록, 장부 카테고리, 해빗과 그룹처럼 가끔 손대는 관리는 모두 여기에서.</p>
        </div>
        <div id="page-settings-body"></div>
      </section>

    </main>

    <!-- 하단 탭바 — 항상 접근 가능한 위젯 -->
    <nav id="tabbar" class="tabbar">
      <button class="tabbar-item" data-float="todo" title="할 일">
        <span class="icon">✅</span>
        <span class="label">할일</span>
      </button>
      <button class="tabbar-item" data-float="memo" title="메모장">
        <span class="icon">📝</span>
        <span class="label">메모</span>
      </button>
      <button class="tabbar-item" data-float="pomodoro" title="뽀모도로">
        <span class="icon">🍅</span>
        <span class="label pomo-time">25:00</span>
      </button>
      <button class="tabbar-item" id="music-popup-trigger-bottom" title="음악 플레이어">
        <span class="icon">🎵</span>
        <span class="label">음악</span>
      </button>
    </nav>

    <!-- 음악 플레이어 팝업 -->
    <div id="music-popup" class="music-popup">
      <div class="music-popup-header">
        <h3>음악</h3>
        <button id="music-popup-close" class="btn btn-icon" aria-label="닫기">✕</button>
      </div>
      <div class="music-popup-body">
        <div id="music-player-content"></div>
      </div>
    </div>
  </div>

</div>

<div id="toast-wrap"></div>

<!-- 번들러 없이 순서대로 로드합니다 (file:// 로 열어도 동작하도록 ES module 을 쓰지 않습니다) -->
<script src="./js/util.js"></script>
<script src="./js/store.js"></script>
<script src="./js/shell.js"></script>
<script src="./js/quick-add.js"></script>
<script src="./js/markdown.js"></script>
<script src="./js/pomodoro.js"></script>
<script src="./js/motto.js"></script>
<script src="./js/music.js"></script>
<script src="./js/todo.js"></script>
<script src="./js/memo.js"></script>
<script src="./js/habits.js"></script>
<script src="./js/habitgrid.js"></script>
<script src="./js/calendar.js"></script>
<script src="./js/work.js"></script>
<script src="./js/ledger.js"></script>
<script src="./js/assistants.js"></script>
<script src="./js/tax.js"></script>
<script src="./js/settings.js"></script>
<script src="./js/app.js"></script>

</body>
</html>
